{% load static %}
<!-- Navigation -->
<nav id="main-nav"
  class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-slate-950/75 backdrop-blur-xl transition-colors duration-300 h-24">
  <div id="main-nav-shell" class="mx-auto flex w-full items-center gap-4 px-4 py-10 transition-all duration-300 sm:px-6 lg:px-8">
    <!-- Logo -->
    <a href="{% url 'landing' %}" class="shrink-0 flex items-center">
      <img src="{% static 'landing/turquaway-logo.png' %}" alt="Turquaway" class="h-10 w-auto" />
    </a>

    <!-- Desktop navigation -->
    <div class="hidden items-center gap-1 lg:flex">
      <a href="/#features" class="px-3 py-2 text-md font-medium text-slate-200 transition hover:bg-white/10 hover:text-white"
        data-i18n="navFeatures">Features</a>
      <a href="/#how-it-works" class="px-3 py-2 text-md font-medium text-slate-200 transition hover:bg-white/10 hover:text-white"
        data-i18n="navHowItWorks">How it Works</a>
      <a href="/#testimonials" class="px-3 py-2 text-md font-medium text-slate-200 transition hover:bg-white/10 hover:text-white"
        data-i18n="navTestimonials">Testimonials</a>
    </div>

    <!-- Right side -->
    <div class="ms-auto flex items-center gap-2 sm:gap-3">
      <button
        id="nav-create-plan-btn"
        type="button"
        class="hidden items-center gap-2 border border-lagoon-500/60 bg-white/5 px-4 py-2.5 text-sm font-semibold text-lagoon-300 transition hover:border-lagoon-400 hover:bg-lagoon-500 hover:text-slate-950 lg:inline-flex"
      >
        <i class="fa-solid fa-wand-magic-sparkles text-md"></i>
        <span data-i18n="navCreatePlan">Create Plan</span>
      </button>

      <!-- Language menu -->
      <div class="language-menub text-md" data-language-menu>
        <button id="language-menu-button" type="button" class="language-menu-trigger" aria-haspopup="listbox"
          aria-expanded="false" aria-controls="language-menu-list">
          <span class="language-menu-label" data-i18n="languageLabel">Language</span>
          <span class="language-menu-current" data-language-current>EN</span>
          <i class="fa-solid fa-chevron-down language-menu-chevron" aria-hidden="true"></i>
        </button>
        <div id="language-menu-list" class="language-menu-list hidden" role="listbox"
          aria-labelledby="language-menu-button"></div>
      </div>

      <!-- Download -->
      <a href="{% url 'landing' %}#cta"
        class="hidden items-center gap-2 border border-lagoon-500 bg-lagoon-500/10 px-5 py-2.5 text-md font-semibold text-lagoon-300 transition hover:bg-lagoon-500 hover:text-slate-950 xl:inline-flex">
        <span data-i18n="navDownload">Download</span>
      </a>

      <!-- Auth: guest (not logged in) -->
      <div id="nav-auth-guest" class="hidden items-center gap-2">
        <a href="/login/"
          class="hidden px-4 py-2.5 text-md font-medium text-slate-300 transition hover:text-white sm:inline-block"
          data-i18n="navSignIn">Sign In</a>
        <a href="/register/"
          class="hidden items-center rounded-none border border-lagoon-500 bg-lagoon-500 px-4 py-2.5 text-md font-semibold text-slate-950 shadow-glow transition hover:bg-lagoon-300 sm:inline-flex"
          data-i18n="navSignUp">Sign Up</a>
      </div>

      <!-- Auth: user (logged in) -->
      <div id="nav-auth-user" class="hidden items-center gap-2">
        <div class="relative hidden sm:block">
          <button id="nav-user-menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="nav-user-dropdown"
            class="inline-flex items-center gap-3 rounded-none border border-white/20 bg-white/10 px-3 py-2.5 text-md font-medium text-slate-200 transition hover:border-lagoon-500/40 hover:bg-white/20">
            <span id="nav-user-initial" class="flex h-8 w-8 items-center justify-center border border-lagoon-500/60 bg-lagoon-500/15 text-md font-semibold uppercase text-lagoon-200">U</span>
            <span id="nav-user-name"></span>
            <i class="fa-solid fa-chevron-down text-[11px] text-slate-400 transition duration-200" id="nav-user-menu-chevron"></i>
          </button>
          <div id="nav-user-dropdown" class="absolute right-0 top-full z-20 mt-2 hidden min-w-[13rem] border border-white/15 bg-slate-950/95 p-2 text-sm shadow-[0_18px_42px_rgba(2,6,23,0.4)] backdrop-blur-xl" role="menu" aria-labelledby="nav-user-menu-btn">
            <a href="{% url 'account' %}" title="Account" aria-label="Account"
              class="flex items-center gap-3 px-3 py-3 text-slate-200 transition hover:bg-white/10 hover:text-white" role="menuitem">
              <i class="fa-regular fa-circle-user text-lagoon-300"></i>
              <span data-i18n="navAccount">Account</span>
            </a>
            <button id="nav-logout-btn" type="button"
              class="flex w-full items-center gap-3 px-3 py-3 text-left text-rose-300 transition hover:bg-rose-500/10 hover:text-rose-200"
              role="menuitem">
              <i class="fa-solid fa-right-from-bracket text-sm"></i>
              <span data-i18n="navLogout">Sign Out</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Hamburger -->
      <button id="nav-hamburger"
        class="flex h-10 w-10 flex-col items-center justify-center gap-1.5 border border-white/20 bg-white/10 lg:hidden"
        aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger-bar block h-0.5 w-5 bg-white transition-all duration-300"></span>
        <span class="hamburger-bar block h-0.5 w-5 bg-white transition-all duration-300"></span>
        <span class="hamburger-bar block h-0.5 w-5 bg-white transition-all duration-300"></span>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div id="nav-mobile-menu" class="hidden border-t border-white/10 bg-slate-950/95 lg:hidden">
    <div class="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-4 sm:px-6">
      <button id="nav-mobile-create-plan" type="button"
        class="mb-2 inline-flex items-center justify-center gap-2 rounded-none bg-lagoon-500 px-3 py-2 text-center text-sm font-semibold text-slate-950 transition hover:bg-lagoon-300">
        <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
        <span data-i18n="navCreatePlan">Create Plan</span>
      </button>
      <a href="/#features" class="px-3 py-2 text-slate-200 transition hover:bg-white/10"
        data-i18n="navFeatures">Features</a>
      <a href="/#how-it-works" class="px-3 py-2 text-slate-200 transition hover:bg-white/10"
        data-i18n="navHowItWorks">How it Works</a>
      <a href="/#testimonials" class="px-3 py-2 text-slate-200 transition hover:bg-white/10"
        data-i18n="navTestimonials">Testimonials</a>
      <div class="border-t border-white/10 pt-2">
        <!-- Guest links -->
        <a href="/login/" id="nav-mobile-signin" class="block px-3 py-2 text-slate-200 transition hover:bg-white/10"
          data-i18n="navSignIn">Sign In</a>
        <a href="/register/" id="nav-mobile-signup"
          class="mt-1 block rounded-none bg-lagoon-500 px-3 py-2 text-center text-sm font-semibold text-slate-950 transition hover:bg-lagoon-300"
          data-i18n="navSignUp">Sign Up</a>
        <!-- User links -->
        <a href="{% url 'account' %}" id="nav-mobile-account" title="Account" aria-label="Account"
          class="hidden mt-1 flex items-center gap-2 px-3 py-2 text-slate-200 transition hover:bg-white/10">
          <i class="fa-regular fa-circle-user text-lagoon-300"></i>
          <span id="nav-mobile-user-name"></span>
        </a>
        <button id="nav-mobile-logout" type="button"
          class="hidden mt-1 w-full px-3 py-2 text-left text-sm text-rose-400 transition hover:bg-rose-500/10">
          <i class="fa-solid fa-right-from-bracket mr-2"></i>
          <span data-i18n="navLogout">Sign Out</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<script>
  (function () {

    // --- Navbar bg: transparent on home hero, solid everywhere else ---
    const $nav = document.getElementById('main-nav');
    const $shell = document.getElementById('main-nav-shell');
    const isHome = window.location.pathname === '/';
    const $desktopCreatePlan = document.getElementById('nav-create-plan-btn');
    const $userMenuBtn = document.getElementById('nav-user-menu-btn');
    const $userDropdown = document.getElementById('nav-user-dropdown');
    const $userChevron = document.getElementById('nav-user-menu-chevron');
    const $userInitial = document.getElementById('nav-user-initial');

    function setCreatePlanTone(homeState) {
      if (!$desktopCreatePlan) return;

      if (homeState) {
        $desktopCreatePlan.className = 'hidden items-center gap-2 border border-lagoon-500/60 bg-white/5 px-4 py-2.5 text-sm font-semibold text-lagoon-300 transition hover:border-lagoon-400 hover:bg-lagoon-500 hover:text-slate-950 lg:inline-flex';
        return;
      }

      $desktopCreatePlan.className = 'hidden items-center gap-2 border border-white/15 bg-white/5 px-3 py-2 text-sm font-semibold text-slate-200 transition hover:border-lagoon-500/40 hover:bg-white/10 hover:text-white lg:inline-flex';
    }

    function setNavBg(solid) {
      $nav.classList.toggle('is-at-top', !solid);

      if (solid) {
        $nav.classList.remove('bg-transparent', 'border-transparent', 'shadow-none');
        $nav.classList.add('bg-slate-950', 'border-white/10', 'shadow-[0_16px_38px_rgba(2,6,23,0.28)]');
        $shell?.classList.remove('py-4');
        $shell?.classList.add('py-3');
      } else {
        $nav.classList.remove('bg-slate-950', 'bg-slate-950/75', 'border-white/10', 'shadow-[0_16px_38px_rgba(2,6,23,0.28)]');
        $nav.classList.add('bg-transparent', 'border-transparent', 'shadow-none');
        $shell?.classList.remove('py-3');
        $shell?.classList.add('py-4');
      }

      setCreatePlanTone(!solid && isHome);
    }

    function closeUserMenu() {
      if (!$userDropdown || !$userMenuBtn) return;
      $userDropdown.classList.add('hidden');
      $userMenuBtn.setAttribute('aria-expanded', 'false');
      $userChevron?.classList.remove('rotate-180');
    }

    function toggleUserMenu() {
      if (!$userDropdown || !$userMenuBtn) return;
      const willOpen = $userDropdown.classList.contains('hidden');
      if (willOpen) {
        $userDropdown.classList.remove('hidden');
        $userMenuBtn.setAttribute('aria-expanded', 'true');
        $userChevron?.classList.add('rotate-180');
        return;
      }
      closeUserMenu();
    }

    if (isHome) {
      const heroThreshold = () => window.innerHeight * 0.8;
      window.addEventListener('scroll', () => setNavBg(window.scrollY > heroThreshold()), { passive: true });
      setNavBg(window.scrollY > heroThreshold());
    } else {
      $nav.classList.remove('bg-slate-950/75');
      $nav.classList.add('bg-slate-950');
      setNavBg(true);
    }

    // --- Auth state ---
    const token = localStorage.getItem('tw_access');
    const userRaw = localStorage.getItem('tw_user');
    const $guest = document.getElementById('nav-auth-guest');
    const $authUser = document.getElementById('nav-auth-user');
    const $mobileSignIn = document.getElementById('nav-mobile-signin');
    const $mobileSignUp = document.getElementById('nav-mobile-signup');
    const $mobileAccount = document.getElementById('nav-mobile-account');
    const $mobileLogout = document.getElementById('nav-mobile-logout');

    function logout() {
      localStorage.removeItem('tw_access');
      localStorage.removeItem('tw_refresh');
      localStorage.removeItem('tw_user');
      window.location.href = '/';
    }

    if (token && userRaw) {
      try {
        const u = JSON.parse(userRaw);
        const name = (u.full_name || '').split(' ')[0];
        const $name = document.getElementById('nav-user-name');
        const $mobileName = document.getElementById('nav-mobile-user-name');
        const initial = (u.full_name || u.email || 'U').trim().charAt(0);
        if ($name) $name.textContent = name;
        if ($mobileName) $mobileName.textContent = name;
        if ($userInitial) $userInitial.textContent = initial;
      } catch (_) { }
      // Logged in: show user panel only
      $guest?.classList.add('hidden');
      $authUser?.classList.replace('hidden', 'flex');
      if ($mobileSignIn) $mobileSignIn.classList.add('hidden');
      if ($mobileSignUp) $mobileSignUp.classList.add('hidden');
      if ($mobileAccount) $mobileAccount.classList.remove('hidden');
      if ($mobileLogout) $mobileLogout.classList.remove('hidden');
    } else {
      // Not logged in: show guest panel only
      $guest?.classList.replace('hidden', 'flex');
      $authUser?.classList.add('hidden');
    }

    $userMenuBtn?.addEventListener('click', (event) => {
      event.stopPropagation();
      toggleUserMenu();
    });

    document.addEventListener('click', (event) => {
      if (!$userDropdown || !$userMenuBtn) return;
      if ($userDropdown.contains(event.target) || $userMenuBtn.contains(event.target)) return;
      closeUserMenu();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeUserMenu();
    });

    document.getElementById('nav-logout-btn')?.addEventListener('click', logout);
    document.getElementById('nav-mobile-logout')?.addEventListener('click', logout);

  })();
</script>
