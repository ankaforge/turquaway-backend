{% load static %}
<!-- Navigation -->
<nav
  id="main-nav"
  class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-slate-950/75 backdrop-blur-xl transition-colors duration-300"
>
  <div
    class="mx-auto flex w-full max-w-7xl items-center gap-4 px-4 py-4 sm:px-6 lg:px-8"
  >
    <!-- Logo -->
    <a href="{% url 'landing' %}" class="shrink-0 flex items-center">
      <img src="{% static 'landing/turquaway-logo.png' %}" alt="Turquaway" class="h-10 w-auto" />
    </a>

    <!-- Center: Explore dropdown (desktop) -->
    <div class="absolute left-1/2 hidden -translate-x-1/2 lg:block">
      <div class="language-menu" data-nav-explore>
        <button
          id="nav-explore-btn"
          type="button"
          class="language-menu-trigger"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="nav-explore-list"
        >
          <span data-i18n="navExplore">Explore</span>
          <i class="fa-solid fa-chevron-down language-menu-chevron" aria-hidden="true"></i>
        </button>
        <div
          id="nav-explore-list"
          class="language-menu-list hidden"
        >
          <a href="/#features" class="language-option" data-i18n="navFeatures">Features</a>
          <a href="/#how-it-works" class="language-option" data-i18n="navHowItWorks">How it Works</a>
          <a href="/#testimonials" class="language-option" data-i18n="navTestimonials">Testimonials</a>
        </div>
      </div>
    </div>

    <!-- Right side -->
    <div class="ms-auto flex items-center gap-2 sm:gap-3">

      <!-- Language menu -->
      <div class="language-menu" data-language-menu>
        <button
          id="language-menu-button"
          type="button"
          class="language-menu-trigger"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="language-menu-list"
        >
          <span class="language-menu-label" data-i18n="languageLabel">Language</span>
          <span class="language-menu-current" data-language-current>EN</span>
          <i class="fa-solid fa-chevron-down language-menu-chevron" aria-hidden="true"></i>
        </button>
        <div
          id="language-menu-list"
          class="language-menu-list hidden"
          role="listbox"
          aria-labelledby="language-menu-button"
        ></div>
      </div>

      <!-- Download -->
      <a
        href="#cta"
        class="hidden items-center gap-2 border border-lagoon-500 bg-lagoon-500/10 px-5 py-2.5 text-sm font-semibold text-lagoon-300 transition hover:bg-lagoon-500 hover:text-slate-950 sm:inline-flex"
      >
        <span data-i18n="navDownload">Download</span>
      </a>

      <!-- Auth: guest (not logged in) -->
      <div id="nav-auth-guest" class="hidden items-center gap-2">
        <a
          href="/login/"
          class="hidden px-4 py-2.5 text-sm font-medium text-slate-300 transition hover:text-white sm:inline-block"
          data-i18n="navSignIn">Sign In</a>
        <a
          href="/register/"
          class="inline-flex items-center rounded-none border border-lagoon-500 bg-lagoon-500 px-4 py-2.5 text-sm font-semibold text-slate-950 shadow-glow transition hover:bg-lagoon-300"
          data-i18n="navSignUp">Sign Up</a>
      </div>

      <!-- Auth: user (logged in) -->
      <div id="nav-auth-user" class="hidden items-center gap-2">
        <a
          href="/hesabim/"
          class="hidden items-center gap-2 rounded-none border border-white/20 bg-white/10 px-4 py-2.5 text-sm font-medium text-slate-200 transition hover:bg-white/20 sm:inline-flex"
        >
          <i class="fa-regular fa-circle-user text-lagoon-300"></i>
          <span id="nav-user-name"></span>
        </a>
        <button
          id="nav-logout-btn"
          type="button"
          class="hidden items-center rounded-none border border-white/20 bg-white/10 px-3 py-2.5 text-slate-400 transition hover:border-rose-500/40 hover:bg-rose-500/10 hover:text-rose-400 sm:inline-flex"
          aria-label="Sign Out"
        >
          <i class="fa-solid fa-right-from-bracket text-base"></i>
        </button>
      </div>

      <!-- Hamburger -->
      <button
        id="nav-hamburger"
        class="flex h-10 w-10 flex-col items-center justify-center gap-1.5 border border-white/20 bg-white/10 lg:hidden"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <span class="hamburger-bar block h-0.5 w-5 bg-white transition-all duration-300"></span>
        <span class="hamburger-bar block h-0.5 w-5 bg-white transition-all duration-300"></span>
        <span class="hamburger-bar block h-0.5 w-5 bg-white transition-all duration-300"></span>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div
    id="nav-mobile-menu"
    class="hidden border-t border-white/10 bg-slate-950/95 lg:hidden"
  >
    <div class="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-4 sm:px-6">
      <a href="/#features" class="px-3 py-2 text-slate-200 transition hover:bg-white/10" data-i18n="navFeatures">Features</a>
      <a href="/#how-it-works" class="px-3 py-2 text-slate-200 transition hover:bg-white/10" data-i18n="navHowItWorks">How it Works</a>
      <a href="/#testimonials" class="px-3 py-2 text-slate-200 transition hover:bg-white/10" data-i18n="navTestimonials">Testimonials</a>
      <div class="border-t border-white/10 pt-2">
        <!-- Guest links -->
        <a href="/login/" id="nav-mobile-signin" class="block px-3 py-2 text-slate-200 transition hover:bg-white/10" data-i18n="navSignIn">Sign In</a>
        <a href="/register/" id="nav-mobile-signup" class="mt-1 block rounded-none bg-lagoon-500 px-3 py-2 text-center text-sm font-semibold text-slate-950 transition hover:bg-lagoon-300" data-i18n="navSignUp">Sign Up</a>
        <!-- User links -->
        <a href="/hesabim/" id="nav-mobile-account" class="hidden mt-1 flex items-center gap-2 px-3 py-2 text-slate-200 transition hover:bg-white/10">
          <i class="fa-regular fa-circle-user text-lagoon-300"></i>
          <span id="nav-mobile-user-name"></span>
        </a>
        <button id="nav-mobile-logout" type="button" class="hidden mt-1 w-full px-3 py-2 text-left text-sm text-rose-400 transition hover:bg-rose-500/10">
          <i class="fa-solid fa-right-from-bracket mr-2"></i>
          <span data-i18n="navLogout">Sign Out</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<script>
(function () {

  // --- Navbar bg: transparent on home hero, solid everywhere else ---
  const $nav = document.getElementById('main-nav');
  const isHome = window.location.pathname === '/';

  function setNavBg(solid) {
    if (solid) {
      $nav.classList.remove('bg-transparent', 'border-transparent');
      $nav.classList.add('bg-slate-950', 'border-white/10');
    } else {
      $nav.classList.remove('bg-slate-950', 'bg-slate-950/75', 'border-white/10');
      $nav.classList.add('bg-transparent', 'border-transparent');
    }
  }

  if (isHome) {
    const heroThreshold = () => window.innerHeight * 0.8;
    window.addEventListener('scroll', () => setNavBg(window.scrollY > heroThreshold()), { passive: true });
    setNavBg(window.scrollY > heroThreshold());
  } else {
    $nav.classList.remove('bg-slate-950/75');
    $nav.classList.add('bg-slate-950');
  }

  // --- Auth state ---
  const token = localStorage.getItem('tw_access');
  const userRaw = localStorage.getItem('tw_user');
  const $guest = document.getElementById('nav-auth-guest');
  const $authUser = document.getElementById('nav-auth-user');
  const $mobileSignIn = document.getElementById('nav-mobile-signin');
  const $mobileSignUp = document.getElementById('nav-mobile-signup');
  const $mobileAccount = document.getElementById('nav-mobile-account');
  const $mobileLogout = document.getElementById('nav-mobile-logout');

  function logout() {
    localStorage.removeItem('tw_access');
    localStorage.removeItem('tw_refresh');
    localStorage.removeItem('tw_user');
    window.location.href = '/';
  }

  if (token && userRaw) {
    try {
      const u = JSON.parse(userRaw);
      const name = (u.full_name || '').split(' ')[0];
      const $name = document.getElementById('nav-user-name');
      const $mobileName = document.getElementById('nav-mobile-user-name');
      if ($name) $name.textContent = name;
      if ($mobileName) $mobileName.textContent = name;
    } catch (_) {}
    // Logged in: show user panel only
    $guest?.classList.add('hidden');
    $authUser?.classList.replace('hidden', 'flex');
    if ($mobileSignIn) $mobileSignIn.classList.add('hidden');
    if ($mobileSignUp) $mobileSignUp.classList.add('hidden');
    if ($mobileAccount) $mobileAccount.classList.remove('hidden');
    if ($mobileLogout) $mobileLogout.classList.remove('hidden');
  } else {
    // Not logged in: show guest panel only
    $guest?.classList.replace('hidden', 'flex');
    $authUser?.classList.add('hidden');
  }

  document.getElementById('nav-logout-btn')?.addEventListener('click', logout);
  document.getElementById('nav-mobile-logout')?.addEventListener('click', logout);

  // --- Explore dropdown ---
  const $exploreBtn = document.getElementById('nav-explore-btn');
  const $exploreList = document.getElementById('nav-explore-list');
  const $exploreMenu = document.querySelector('[data-nav-explore]');

  function closeExplore() {
    $exploreList?.classList.add('hidden');
    $exploreBtn?.setAttribute('aria-expanded', 'false');
  }

  if ($exploreBtn && $exploreList) {
    $exploreBtn.addEventListener('click', () => {
      const isOpen = $exploreBtn.getAttribute('aria-expanded') === 'true';
      $exploreList.classList.toggle('hidden', isOpen);
      $exploreBtn.setAttribute('aria-expanded', String(!isOpen));
    });
    $exploreList.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', closeExplore);
    });
    document.addEventListener('click', e => {
      if ($exploreMenu && !$exploreMenu.contains(e.target)) closeExplore();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeExplore();
    });
  }

})();
</script>
