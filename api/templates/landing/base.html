<!doctype html>
{% load static %}
<html lang="en" dir="ltr">
  <!-- Head -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Turquaway - AI Tour Planner{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              display: ["Playfair Display", "serif"],
              arabicSans: ["Noto Sans Arabic", "sans-serif"],
              arabicDisplay: ["Noto Kufi Arabic", "sans-serif"],
            },
            colors: {
              lagoon: {
                50: "#e6f9f5",
                100: "#c0f0e5",
                300: "#4dcdb5",
                500: "#0db28f",
                600: "#0e996f",
                700: "#1ba69a",
                900: "#083d31",
              },
            },
            boxShadow: {
              soft: "0 20px 50px rgba(13, 178, 143, 0.12)",
              glow: "0 16px 35px rgba(13, 178, 143, 0.30)",
            },
            animation: {
              float: "float 8s ease-in-out infinite",
              pulseSlow: "pulseSlow 6s ease-in-out infinite",
              rise: "rise .8s ease-out both",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0px)" },
                "50%": { transform: "translateY(-12px)" },
              },
              pulseSlow: {
                "0%, 100%": { opacity: ".7" },
                "50%": { opacity: "1" },
              },
              rise: {
                from: { opacity: "0", transform: "translateY(18px)" },
                to: { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'landing/styles.css' %}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'landing/favicon/apple-touch-icon.png' %}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'landing/favicon/favicon-32x32.png' %}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'landing/favicon/favicon-16x16.png' %}" />
    <link rel="manifest" href="{% static 'landing/favicon/site.webmanifest' %}" />
    <link rel="shortcut icon" href="{% static 'landing/favicon/favicon.ico' %}" />
    {% block extra_head %}{% endblock %}
  </head>
  <!-- Background -->
  <body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div
        class="absolute -top-16 left-1/2 h-72 w-72 -translate-x-1/2 bg-lagoon-500/30 blur-3xl animate-pulseSlow"
      ></div>
      <div
        class="absolute top-1/3 -left-24 h-72 w-72 bg-cyan-500/20 blur-3xl animate-float"
      ></div>
      <div
        class="absolute bottom-0 right-0 h-80 w-80 bg-emerald-500/20 blur-3xl animate-pulseSlow"
      ></div>
    </div>

    {% include 'landing/navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'landing/footer.html' %}

    <script src="{% static 'landing/script.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
