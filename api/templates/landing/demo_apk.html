{% extends 'landing/base.html' %}

{% block title %}Turquaway - Demo APK{% endblock %}

{% block content %}
<main class="bg-lagoon-50 px-4 pb-16 pt-28 sm:px-6 lg:px-8 lg:pt-36">
	<section class="mx-auto max-w-3xl border border-lagoon-100 bg-white p-8 text-slate-950 shadow-soft sm:p-10">
		<p class="mb-3 text-xs font-semibold uppercase tracking-[0.22em] text-lagoon-700">
			Turquaway Demo
		</p>
		<h1 class="font-display text-3xl text-slate-950 sm:text-4xl">Android Demo APK</h1>
		<p class="mt-4 text-base leading-7 text-slate-700">
			Download the latest Android demo build and install it on your device.
		</p>

		<div class="mt-8 flex flex-col gap-3 sm:flex-row">
			<a
				href="https://expo.dev/artifacts/eas/r33Lz7yqqFNpD4n3Jj5uc7.apk"
				class="inline-flex items-center justify-center bg-lagoon-500 px-6 py-3 font-semibold text-white transition hover:bg-lagoon-600"
			>
				Download APK
			</a>
			<a
				href="{% url 'landing' %}"
				class="inline-flex items-center justify-center border border-lagoon-100 bg-white px-6 py-3 font-semibold text-lagoon-700 transition hover:bg-lagoon-50"
			>
				Back to Landing
			</a>
		</div>
	</section>
</main>
{% endblock %}
