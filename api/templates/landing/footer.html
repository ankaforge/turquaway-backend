{% load static %}
<!-- Footer -->
<footer class="border-t border-white/10 px-4 py-10 sm:px-6 lg:px-8">
  <div
    class="mx-auto flex w-full max-w-6xl flex-col items-center justify-between gap-6 md:flex-row"
  >
    <div class="text-center md:text-left">
      <img src="{% static 'landing/turquaway-logo.png' %}" alt="Turquaway" class="h-9 w-auto" />
      <p class="mt-1 text-sm text-slate-400" data-i18n="footerCopyright">
        © 2026 Turquaway.
      </p>
    </div>
    <div
      class="flex flex-wrap items-center justify-center gap-6 text-sm text-slate-300"
    >
      <a
        href="{% url 'demo-apk' %}"
        class="transition hover:text-lagoon-300"
        data-i18n="footerDemoApk"
        >Demo APK</a
      >
      <a
        href="/partner/login/"
        class="transition hover:text-lagoon-300"
        data-i18n="footerPartner"
        >Partner</a
      >
      <a
        href="{% url 'about' %}"
        class="transition hover:text-lagoon-300"
        data-i18n="footerCompany1"
        >About Us</a
      >
      <a
        href="{% url 'privacy' %}"
        class="transition hover:text-lagoon-300"
        data-i18n="footerLegal1"
        >Privacy Policy</a
      >
      <a
        href="{% url 'terms' %}"
        class="transition hover:text-lagoon-300"
        data-i18n="footerLegal2"
        >Terms of Service</a
      >
    </div>
    <div class="flex items-center gap-3 text-lg text-slate-300">
      <a
        href="https://youtube.com"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        class="transition hover:text-lagoon-300"
        ><i class="fa-brands fa-youtube"></i
      ></a>
      <a
        href="https://instagram.com"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
        class="transition hover:text-lagoon-300"
        ><i class="fa-brands fa-instagram"></i
      ></a>
      <a
        href="https://facebook.com"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
        class="transition hover:text-lagoon-300"
        ><i class="fa-brands fa-facebook"></i
      ></a>
    </div>
  </div>
</footer>
