{% extends 'landing/base.html' %}
{% load static %}

{% block title %}Sign Up - Turquaway{% endblock %}

{% block content %}
<main class="flex min-h-screen items-center justify-center px-4 pt-28 pb-16">
  <div class="w-full max-w-lg animate-rise">

    <div class="mb-8 text-center">
      <h1 class="font-display text-3xl font-bold text-slate-950" data-i18n="authRegisterHeading">Create Your Account</h1>
      <p class="mt-2 text-slate-600 text-sm" data-i18n="authRegisterSubtitle">Join thousands discovering Türkiye</p>
    </div>

    <div class="rounded-none border border-lagoon-100 bg-white p-8 shadow-soft backdrop-blur-sm">

      <div id="register-error" class="mb-5 hidden rounded-none border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-600"></div>

      <form id="register-form" novalidate class="space-y-5">

        <div>
          <label for="reg-fullname" class="mb-1.5 block text-sm font-medium text-slate-700" data-i18n="authFullName">Full Name</label>
          <input
            id="reg-fullname"
            type="text"
            autocomplete="name"
            required
            data-i18n-placeholder="authFullNamePlaceholder"
            placeholder="Your full name"
            class="w-full rounded-none border border-lagoon-100 bg-lagoon-50/50 px-4 py-3 text-slate-950 placeholder-slate-400 outline-none transition focus:border-lagoon-500 focus:ring-2 focus:ring-lagoon-500/20"
          />
        </div>

        <div>
          <label for="reg-email" class="mb-1.5 block text-sm font-medium text-slate-700" data-i18n="authEmail">Email Address</label>
          <input
            id="reg-email"
            type="email"
            autocomplete="email"
            required
            data-i18n-placeholder="authEmailPlaceholder"
            placeholder="you@example.com"
            class="w-full rounded-none border border-lagoon-100 bg-lagoon-50/50 px-4 py-3 text-slate-950 placeholder-slate-400 outline-none transition focus:border-lagoon-500 focus:ring-2 focus:ring-lagoon-500/20"
          />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="reg-phone" class="mb-1.5 block text-sm font-medium text-slate-700" data-i18n="authPhone">Phone</label>
            <input
              id="reg-phone"
              type="tel"
              autocomplete="tel"
              required
              data-i18n-placeholder="authPhonePlaceholder"
              placeholder="+90 555 000 00 00"
              class="w-full rounded-none border border-lagoon-100 bg-lagoon-50/50 px-4 py-3 text-slate-950 placeholder-slate-400 outline-none transition focus:border-lagoon-500 focus:ring-2 focus:ring-lagoon-500/20"
            />
          </div>
          <div>
            <label for="reg-country" class="mb-1.5 block text-sm font-medium text-slate-700" data-i18n="authCountry">Country</label>
            <select
              id="reg-country"
              required
              class="w-full rounded-none border border-lagoon-100 bg-lagoon-50/50 px-4 py-3 text-slate-950 outline-none transition focus:border-lagoon-500 focus:ring-2 focus:ring-lagoon-500/20 appearance-none"
            >
              <option value="" class="bg-white" data-i18n="authCountryPlaceholder">Select country</option>
              <option value="TR" class="bg-white">Türkiye</option>
              <option value="RU" class="bg-white">Russia</option>
              <option value="DE" class="bg-white">Germany</option>
              <option value="GB" class="bg-white">United Kingdom</option>
              <option value="FR" class="bg-white">France</option>
              <option value="US" class="bg-white">United States</option>
              <option value="SA" class="bg-white">Saudi Arabia</option>
              <option value="AE" class="bg-white">United Arab Emirates</option>
              <option value="KW" class="bg-white">Kuwait</option>
              <option value="QA" class="bg-white">Qatar</option>
              <option value="OM" class="bg-white">Oman</option>
              <option value="BH" class="bg-white">Bahrain</option>
              <option value="JO" class="bg-white">Jordan</option>
              <option value="EG" class="bg-white">Egypt</option>
              <option value="MA" class="bg-white">Morocco</option>
              <option value="DZ" class="bg-white">Algeria</option>
              <option value="TN" class="bg-white">Tunisia</option>
              <option value="LB" class="bg-white">Lebanon</option>
              <option value="IQ" class="bg-white">Iraq</option>
              <option value="PK" class="bg-white">Pakistan</option>
              <option value="IN" class="bg-white">India</option>
              <option value="CN" class="bg-white">China</option>
              <option value="JP" class="bg-white">Japan</option>
              <option value="KR" class="bg-white">South Korea</option>
              <option value="UA" class="bg-white">Ukraine</option>
              <option value="PL" class="bg-white">Poland</option>
              <option value="IT" class="bg-white">Italy</option>
              <option value="ES" class="bg-white">Spain</option>
              <option value="NL" class="bg-white">Netherlands</option>
              <option value="BE" class="bg-white">Belgium</option>
              <option value="SE" class="bg-white">Sweden</option>
              <option value="NO" class="bg-white">Norway</option>
              <option value="AT" class="bg-white">Austria</option>
              <option value="CH" class="bg-white">Switzerland</option>
              <option value="GR" class="bg-white">Greece</option>
              <option value="PT" class="bg-white">Portugal</option>
              <option value="CA" class="bg-white">Canada</option>
              <option value="AU" class="bg-white">Australia</option>
              <option value="NZ" class="bg-white">New Zealand</option>
              <option value="MX" class="bg-white">Mexico</option>
              <option value="BR" class="bg-white">Brazil</option>
              <option value="AZ" class="bg-white">Azerbaijan</option>
              <option value="KZ" class="bg-white">Kazakhstan</option>
              <option value="UZ" class="bg-white">Uzbekistan</option>
              <option value="GE" class="bg-white">Georgia</option>
              <option value="IL" class="bg-white">Israel</option>
              <option value="AM" class="bg-white">Armenia</option>
            </select>
          </div>
        </div>

        <div>
          <label for="reg-password" class="mb-1.5 block text-sm font-medium text-slate-700" data-i18n="authPassword">Password</label>
          <div class="relative">
            <input
              id="reg-password"
              type="password"
              autocomplete="new-password"
              required
              data-i18n-placeholder="authPasswordPlaceholder"
              placeholder="Min. 8 characters"
              class="w-full rounded-none border border-lagoon-100 bg-lagoon-50/50 px-4 py-3 pr-12 text-slate-950 placeholder-slate-400 outline-none transition focus:border-lagoon-500 focus:ring-2 focus:ring-lagoon-500/20"
            />
            <button
              type="button"
              class="absolute inset-y-0 right-4 text-slate-400 transition hover:text-lagoon-600"
              aria-label="Toggle password visibility"
              onclick="togglePw('reg-password', this)"
            >
              <i class="fa-regular fa-eye text-base"></i>
            </button>
          </div>
        </div>

        <div>
          <label for="reg-password-confirm" class="mb-1.5 block text-sm font-medium text-slate-700" data-i18n="authPasswordConfirm">Confirm Password</label>
          <div class="relative">
            <input
              id="reg-password-confirm"
              type="password"
              autocomplete="new-password"
              required
              data-i18n-placeholder="authPasswordConfirmPlaceholder"
              placeholder="Repeat your password"
              class="w-full rounded-none border border-lagoon-100 bg-lagoon-50/50 px-4 py-3 pr-12 text-slate-950 placeholder-slate-400 outline-none transition focus:border-lagoon-500 focus:ring-2 focus:ring-lagoon-500/20"
            />
            <button
              type="button"
              class="absolute inset-y-0 right-4 text-slate-400 transition hover:text-lagoon-600"
              aria-label="Toggle password visibility"
              onclick="togglePw('reg-password-confirm', this)"
            >
              <i class="fa-regular fa-eye text-base"></i>
            </button>
          </div>
        </div>

        <div class="space-y-3 rounded-none border border-lagoon-100 bg-lagoon-50/50 p-4">
          <label class="flex items-start gap-3 cursor-pointer">
            <input
              id="reg-terms"
              type="checkbox"
              required
              class="mt-0.5 h-4 w-4 shrink-0 rounded-none border-lagoon-200 bg-white accent-lagoon-500"
            />
            <span class="text-sm text-slate-600">
              <span data-i18n="authTermsAgree">I agree to the</span>
              <a href="/terms/" target="_blank" class="ml-1 text-lagoon-600 underline hover:text-lagoon-700" data-i18n="authTermsLink">Terms of Service</a>
              <span class="mx-1" data-i18n="authAndWord">and</span>
              <a href="/privacy/" target="_blank" class="text-lagoon-600 underline hover:text-lagoon-700" data-i18n="authPrivacyLink">Privacy Policy</a>
            </span>
          </label>
        </div>

        <button
          type="submit"
          id="register-btn"
          class="flex w-full items-center justify-center gap-2 rounded-none bg-lagoon-500 px-6 py-3.5 text-sm font-semibold text-white shadow-glow transition hover:bg-lagoon-600 disabled:opacity-60"
        >
          <span data-i18n="authRegisterBtn">Create Account</span>
          <i id="register-spinner" class="fa-solid fa-circle-notch fa-spin hidden text-base"></i>
        </button>

      </form>

      <div class="my-6 flex items-center gap-3">
        <div class="h-px flex-1 bg-lagoon-100"></div>
        <span class="text-xs text-slate-400" data-i18n="authOrDivider">or</span>
        <div class="h-px flex-1 bg-lagoon-100"></div>
      </div>

      <p class="text-center text-sm text-slate-600">
        <span data-i18n="authHaveAccount">Already have an account?</span>
        <a href="/login/" class="ml-1 font-semibold text-lagoon-600 transition hover:text-lagoon-700" data-i18n="authSignIn">Sign In</a>
      </p>

    </div>
  </div>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fa-regular fa-eye-slash text-base';
  } else {
    input.type = 'password';
    icon.className = 'fa-regular fa-eye text-base';
  }
}

function showError(msg) {
  const el = document.getElementById('register-error');
  el.textContent = msg;
  el.classList.remove('hidden');
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.getElementById('register-form').addEventListener('submit', async function (e) {
  e.preventDefault();

  const fullName = document.getElementById('reg-fullname').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const country = document.getElementById('reg-country').value;
  const password = document.getElementById('reg-password').value;
  const passwordConfirm = document.getElementById('reg-password-confirm').value;
  const termsChecked = document.getElementById('reg-terms').checked;

  const errorEl = document.getElementById('register-error');
  errorEl.classList.add('hidden');

  if (!fullName || !email || !phone || !country || !password || !passwordConfirm) {
    showError('Please fill in all fields.');
    return;
  }
  if (password !== passwordConfirm) {
    showError('Passwords do not match.');
    return;
  }
  if (!termsChecked) {
    showError('You must agree to the Terms of Service and Privacy Policy.');
    return;
  }

  const btn = document.getElementById('register-btn');
  const spinner = document.getElementById('register-spinner');
  btn.disabled = true;
  spinner.classList.remove('hidden');

  const lang = localStorage.getItem('turquaway-language') || 'en';
  const acceptedAt = new Date().toISOString();

  const payload = {
    full_name: fullName,
    email: email,
    phone: phone,
    country: country,
    password: password,
    password_confirm: passwordConfirm,
    language: lang,
    consents: {
      terms_accepted: true,
      privacy_accepted: true,
      accepted_at: acceptedAt,
      version: 'v1',
    },
  };

  try {
    const resp = await fetch('/api/v1/auth/register/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    const data = await resp.json();

    if (!resp.ok) {
      // Flatten field errors into readable message
      let msg = data.detail || 'Registration failed.';
      if (data.fields) {
        const fieldErrors = Object.entries(data.fields)
          .map(([k, v]) => {
            const errs = Array.isArray(v) ? v : (typeof v === 'object' ? Object.values(v).flat() : [v]);
            return errs.join(' ');
          })
          .join(' ');
        if (fieldErrors) msg = fieldErrors;
      }
      showError(msg);
      return;
    }

    localStorage.setItem('tw_access', data.tokens.access_token);
    localStorage.setItem('tw_refresh', data.tokens.refresh_token);
    localStorage.setItem('tw_user', JSON.stringify(data.user));

    const next = new URLSearchParams(window.location.search).get('next') || '/';
    window.location.href = next;

  } catch (_) {
    showError('Connection error. Please try again.');
  } finally {
    btn.disabled = false;
    spinner.classList.add('hidden');
  }
});

// Redirect if already logged in
if (localStorage.getItem('tw_access')) {
  const next = new URLSearchParams(window.location.search).get('next') || '/';
  window.location.replace(next);
}
</script>
{% endblock %}
